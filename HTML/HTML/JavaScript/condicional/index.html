<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Condicional - JavaScript</title>
    </head>
    <body>
        <div style="text-align: center;">
            <h1>Condicional - JavaScript</h1>
            <button onclick="verificar()">Verificar</button>
            <script>
                function verificar() {
                    let idade = prompt("Digite sua idade: ");
                    console.log(idade);
                    if (idade >= 18) {
                        alert("Você é maior de idade!");
                        console.log("Você é maior de idade!");
                    } else {
                        alert("Você é menor de idade!");
                        console.log("Você é menor de idade!");
                    }
                }
            </script>

            <h2>Calculadora</h2>
            <button onclick="calculadora()">Calcular</button>
            <script>
                function calculadora() {
                    let num1 = parseFloat(prompt("Digite o primeiro número: "));
                    let operacao = prompt("Digite a operação (+, -, *, /): ");
                    let num2 = parseFloat(prompt("Digite o segundo número: "));
                    let resultado;

                    if (operacao === "+") {
                        resultado = num1 + num2;
                    } else if (operacao === "-") {
                        resultado = num1 - num2;
                    } else if (operacao === "*") {
                        resultado = num1 * num2;
                    } else if (operacao === "/") {
                        if (num2 !== 0) {
                            resultado = num1 / num2;
                        } else {
                            alert("Não é possível dividir por zero!");
                            return;
                        }
                    } else {
                        alert("Operação inválida!");
                        return;
                    }

                    alert(`O resultado é: ${resultado}`);
                    document.getElementById("valor").innerHTML = resultado;
                }
            </script>
            
            <h2>Calculadora com imput</h2>
            <script>
                function calculadoraInput() {
                    let num1 = parseFloat(document.getElementById("num1").value);
                    let operacao = document.getElementById("operacao").value;
                    let num2 = parseFloat(document.getElementById("num2").value);
                    let resultado;
                    
                    if (operacao === "+") {
                        resultado = num1 + num2;
                    } else if (operacao === "-") {
                        resultado = num1 - num2;
                    } else if (operacao === "*") {
                        resultado = num1 * num2;
                    } else if (operacao === "/") {
                        if (num2 !== 0) {
                            resultado = num1 / num2;
                        } else {
                            alert("Não é possível dividir por zero!");
                            return;
                        }
                    } else {
                        alert("Operação inválida!");
                        return;
                    }
                    
                    document.getElementById("valor").innerHTML = resultado;
                    alert(`O resultado é: ${resultado}`);
                }
                </script>
                <input type="number" id="num1" placeholder="Número 1">
                <input type="text" id="operacao" placeholder="Operação (+, -, *, /)">
                <input type="number" id="num2" placeholder="Número 2">  
                <button onclick="calculadoraInput()">Calcular</button>
        </div>
        <h3>Confira o Valor: <span id="valor">0</span></h3>
    </body>
    </head>
